# Deploy this Blueprint separately from the main VIBEOS services.
# It builds the local tagger_service/ directory as an independent Render web service.
services:
  - type: web
    name: vibeos-tagger
    runtime: docker
    rootDir: ./tagger_service
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: TAGGER_API_KEY
        generateValue: true
      - key: TAGGER_MAX_MB
        value: "15"
      - key: TAGGER_WORKERS
        value: "2"
