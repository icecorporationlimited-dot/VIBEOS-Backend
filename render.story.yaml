# Render account: vibeos-worker-story
# Web Service (NOT background worker) -> worker.py opens a tiny health server on $PORT.
services:
  - type: web
    name: vibeos-worker-story
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: starter                 # free = sleeps after 15 min idle (needs external pinger), starter = 24/7
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: MONGODB_URI        # SAME value in all 3 accounts + main web service
        sync: false
      - key: JOB_TYPES
        value: smart_story,story_card
      - key: OPENROUTER_API_KEY   # smart_story needs it
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
