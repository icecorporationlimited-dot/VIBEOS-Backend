[build]
  publish = "."
  functions = "netlify/functions"

# Asset Studio: uploader page + its API must be exempted from the catch-all proxy below.
[[redirects]]
  from = "/asset-studio"
  to = "/asset-studio.html"
  status = 200

[[redirects]]
  from = "/api/asset-studio"
  to = "/.netlify/functions/asset-studio"
  status = 200

# The app now runs from the VIBEOS backend (same origin = working login cookies).
[[redirects]]
  from = "/*"
  to = "https://vibeos-backend.onrender.com/app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
